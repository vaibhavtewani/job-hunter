name: job-hunter

on:
  schedule:
    - cron: "17 * * * *"        # hourly at :17 (top of the hour is the most delayed slot on GitHub)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no notifications, state not saved)"
        type: boolean
        default: false

permissions:
  contents: write               # push state to the `state` branch

concurrency:
  group: job-hunter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check out state branch into .state
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state
            git worktree add -B state .state FETCH_HEAD
          else
            git worktree add --detach .state
            cd .state
            git checkout --orphan state
            git rm -rfq .
          fi

      - name: Run job hunter
        env:
          STATE_DIR: .state
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m jobhunter run $([ "$DRY_RUN" = "true" ] && echo --dry-run)

      - name: Save state
        if: env.DRY_RUN != 'true'
        run: |
          cd .state
          git add -A
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -qm "state: run ${{ github.run_id }}"
          git push -q origin HEAD:state

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
