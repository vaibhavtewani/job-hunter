  # Example second profession: copy, rename, set enabled: true.
  - name: data-engineering-gcc
    enabled: false
    title_include: [data engineer, analytics engineer, etl developer, bi developer, data analyst]
    title_exclude: [senior, sr, lead, principal, staff, director, head of, manager]
    locations: *gcc_locations
    preferred_locations: [dubai, riyadh]
    score_keywords: [python, sql, spark, airflow, dbt, snowflake, databricks, aws, azure, gcp, kafka, etl, data modelling]
    boost_phrases: [graduate, junior, entry level, 0-2 years, 1-3 years]
    penalty_title: [manager]
    penalty_text: [5+ years, 7+ years, arabic speaker, uae nationals, saudi nationals]

sources:
  # 1. Company hiring systems with public JSON job boards. Zero cost, no blocking risk.
  #    Find more with:  python -m jobhunter probe <company-slug> [...]
  greenhouse:
    enabled: true
    boards:
      - {token: careem, company: Careem}
      - {token: tamara, company: Tamara}
      - {token: okx, company: OKX}
      - {token: stripe, company: Stripe}
      - {token: databricks, company: Databricks}
      - {token: mongodb, company: MongoDB}
      - {token: datadog, company: Datadog}
  lever:
    enabled: true
    boards:
      - {site: binance, company: Binance}
      - {site: fresha, company: Fresha}
  ashby:
    enabled: true
    boards:
      - {name: ziina, company: Ziina}
  smartrecruiters:
    enabled: true
    max_pages: 5
    companies:
      - {id: RolandBerger, company: Roland Berger}
  workday:
    enabled: true
    max_pages: 3
    search: [Dubai, Abu Dhabi, Riyadh, Doha]    # Workday search text; per-board "search" overrides
    boards:
      - {host: mmc.wd1.myworkdayjobs.com, tenant: mmc, site: MMC, company: Marsh McLennan (Oliver Wyman / Mercer)}
      - {host: accenture.wd103.myworkdayjobs.com, tenant: accenture, site: AccentureCareers, company: Accenture}
      - {host: mastercard.wd1.myworkdayjobs.com, tenant: mastercard, site: CorporateCareers, company: Mastercard}
      - {host: citi.wd5.myworkdayjobs.com, tenant: citi, site: "2", company: Citi}

  # 2. Google for Jobs via SerpApi. Covers LinkedIn/Bayt/GulfTalent/company sites without scraping them.
  #    Skipped automatically until SERPAPI_KEY is set. Budget: 3 queries x 2 runs/day = ~180 searches/month.
  serpapi:
    enabled: true
    min_interval_hours: 12
    queries:
      - {q: strategy analyst, location: United Arab Emirates}
      - {q: management consulting graduate, location: Saudi Arabia}
      - {q: business analyst strategy, location: Qatar}

  # 3. Job-alert emails the boards send you. Create alerts on LinkedIn, Bayt, GulfTalent, Naukrigulf and Indeed
  #    first (see README). Skipped automatically until GMAIL_ADDRESS + GMAIL_APP_PASSWORD are set.
  gmail_alerts:
    enabled: true
    trust_location: true      # the alert was already set up for your locations
    lookback_days: 3
    max_messages_per_sender: 30
    senders:
      - jobalerts-noreply@linkedin.com
      - bayt.com
      - gulftalent.com
      - naukrigulf.com
      - indeed.com
