      - market research
      - benchmarking
      - competitive intelligence
      - financial model
      - financial modelling
      - financial modeling
      - business case
      - due diligence
      - m&a
      - go-to-market
      - gtm
      - growth
      - partnerships
      - business development
      - stakeholder
      - problem solving
      - hypothesis
      - analytics
      - dashboard
      - excel
      - powerpoint
      - looker
      - data-driven
      - project management
      - operations
      - process improvement
      - digital
      - ai
      - e-commerce
