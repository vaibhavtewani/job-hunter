# WHAT to search for and WHERE. WHO is searching lives in profile.yaml.
# Supporting another profession = add a search profile below. Supporting another board = add a source adapter.
# Any string may reference environment variables as ${VAR} or ${VAR:-default}.

run:
  max_age_days: 21            # ignore postings older than this; dedup state decides what is "new"
  seen_retention_days: 120    # forget seen jobs after this long
  max_enrich_per_run: 80      # detail fetches (descriptions) for new jobs whose listing had none
  request_timeout_s: 20
  state_dir: state            # overridden by STATE_DIR (GitHub Actions points it at the state branch)
  output_dir: output

digest:
  min_score: 40               # a clean title match alone scores 40; penalties push jobs below
  high_score: 70              # Telegram alert + application pack
  max_jobs: 40                # cap per email

notify:
  email:
    enabled: true             # needs GMAIL_ADDRESS + GMAIL_APP_PASSWORD (DIGEST_TO optional)
    smtp_host: smtp.gmail.com
    smtp_port: 465
  telegram:
    enabled: true             # needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
    min_score: 70

applications:                 # application packs (tailored CV + cover letter draft + answers)
  enabled: true
  min_score: 70
  max_per_run: 10

llm:                          # optional; only used when ANTHROPIC_API_KEY is set
  model: claude-haiku-4-5-20251001
  max_tokens: 1500

search_profiles:
  - name: strategy-consulting-gcc
    enabled: true
    # A job title must contain at least one of these (whole words, case-insensitive)...
    title_include:
