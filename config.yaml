      - consulting
      - transformation
      - business analyst
      - commercial analyst
      - commercial excellence
      - business development
      - partnerships
      - growth analyst
      - growth associate
      - corporate development
      - m&a
      - investment analyst
      - pricing analyst
      - revenue analyst
      - business operations
      - bizops
      - operations analyst
      - program analyst
      - pmo
      - value creation
      - chief of staff
      - founders associate
      - founder's associate
      - management trainee
      - graduate program
      - graduate programme
      - leadership development program
      - rotational program
    # ...and none of these. Checked against the TITLE only.
